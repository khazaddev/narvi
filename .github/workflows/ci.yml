name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-name:
    # Enforces the <type>/<short-kebab-description> branch naming convention
    # documented in CLAUDE.md — only meaningful on pull_request events, since
    # github.head_ref is empty on push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name follows Conventional-Commits type/kebab-description
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! [[ "$BRANCH" =~ ^(feat|fix|docs|chore|refactor|test|perf|ci|build)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name '$BRANCH' doesn't follow <type>/<short-kebab-description> (see CLAUDE.md). Allowed types: feat, fix, docs, chore, refactor, test, perf, ci, build."
            exit 1
          fi
          echo "Branch name '$BRANCH' OK"

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contracts dependencies
        run: npm ci
        working-directory: contracts

      # Step 17 (§7): installs the real OpenCode binary so the OpenCode
      # adapter's own server-only contract tests (spawning it, GET
      # /api/health, POST /session, GET /event's server.connected
      # handshake -- no AI provider call, no credential needed) run for
      # real in CI, not just on a dev machine. This CI runner has no AI
      # provider configured (no OPENAI_API_KEY/ANTHROPIC_API_KEY secret,
      # and no `opencode auth login` credential store) -- the REAL-
      # scripted-turn tests (internal/adapters/outbound/opencode's own
      # TestRealTurn_* tests) correctly detect that and skip gracefully
      # rather than fail. This is a deliberate, visible trade-off: those
      # tests only prove the SSE-translation logic against a real model
      # response on a machine that HAS a provider configured (verified on
      # a dev machine during this Step's own design phase) -- adding a
      # paid provider secret to CI is a decision left to the user, not
      # made unilaterally here (see this Step's own report/PR description
      # for the same note).
      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Vet
        run: make vet

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Lint (custom checks)
        run: go run ./tools/lint/narvichecks ./...

      - name: Test
        run: make test

      - name: Test (integration)
        run: make test-integration

      - name: Contracts (schema codegen drift + TS typecheck)
        run: make contracts-check

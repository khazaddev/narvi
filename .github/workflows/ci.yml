name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-name:
    # Enforces the <type>/<short-kebab-description> branch naming convention
    # documented in CLAUDE.md — only meaningful on pull_request events, since
    # github.head_ref is empty on push. Dependabot branches are exempt: their
    # dependabot/<ecosystem>/<dependency>-<version> scheme is fixed by the bot
    # (only the separator is configurable), and the convention targets branches
    # a human or agent names.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name follows Conventional-Commits type/kebab-description
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Branch '$BRANCH' is a Dependabot branch — exempt from the naming convention"
            exit 0
          fi
          if ! [[ "$BRANCH" =~ ^(feat|fix|docs|chore|refactor|test|perf|ci|build)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name '$BRANCH' doesn't follow <type>/<short-kebab-description> (see CLAUDE.md). Allowed types: feat, fix, docs, chore, refactor, test, perf, ci, build."
            exit 1
          fi
          echo "Branch name '$BRANCH' OK"

  commit-scope:
    # ADVISORY ONLY — never fails the build. CLAUDE.md defines a commit's scope
    # as "the primary package or directory touched", but that is a judgement
    # call this check cannot make reliably, so it only surfaces the one case
    # that is actively misleading rather than merely imprecise: a scope that
    # names a REAL directory in the repo which the commit touched no file
    # under. That is what makes `git log --grep='(sandbox)'` return commits
    # that never went near internal/domain/sandbox while missing the ones that
    # did (the audit finding this job exists for).
    #
    # A scope naming no directory at all (`identity`, spanning identitylink +
    # slack + linear) is deliberately SKIPPED: it is a conceptual scope, so
    # there is no package for a reader to be misled about.
    #
    # Calibrated against 150 commits of this repo's own history before being
    # added: 111 matched, 13 warned, 26 skipped. Most of those 13 are a
    # domain-concept scope used for work in a sibling package (`outbox` for
    # outboxworker, `turn` for httpapi) — defensible, which is exactly why
    # this warns instead of blocking. Treat a warning as "worth a glance",
    # never as "must change".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check commit scopes against touched directories (advisory)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Every directory basename in the tree, so a scope can be tested for
          # "is this even a package name" before judging the commit.
          dirs=$(git ls-tree -rd --name-only "$HEAD" | awk -F/ '{print $NF}' | sort -u)
          warned=0

          # --no-merges: merge commits are exempt from Conventional Commits
          # per CLAUDE.md, and their subjects are generated by GitHub anyway.
          while IFS='|' read -r sha subject; do
            [ -z "$sha" ] && continue
            scope=$(printf '%s' "$subject" | sed -nE 's/^[a-z]+\(([a-z0-9_-]+)\)!?:.*/\1/p')
            [ -z "$scope" ] && continue
            printf '%s\n' "$dirs" | grep -qxF "$scope" || continue

            files=$(git show --pretty=format: --name-only "$sha" | grep -v '^$' || true)
            if ! printf '%s\n' "$files" | grep -qE "(^|/)${scope}(/|\$)"; then
              warned=$((warned + 1))
              echo "::warning::Commit $(git log -1 --format=%h "$sha") is scoped ($scope), which names a real directory, but touches no file under it — consider a scope matching the package actually changed. Advisory only; see CLAUDE.md. Subject: ${subject}"
            fi
          done < <(git log --no-merges --format='%H|%s' "$BASE..$HEAD")

          if [ "$warned" -eq 0 ]; then
            echo "All scoped commits name a directory they actually touched."
          else
            echo "$warned advisory scope warning(s) above — this job never fails the build."
          fi

  # ci runs everything that's cheap and needs no Docker: vet, both linters,
  # the plain (non-integration) unit test suite, and the contracts
  # codegen-drift/typecheck check. test-integration (below) depends on this
  # job passing before it spends any matrix-runner/Docker time, preserving
  # the previous single-job behavior where a vet/lint/test failure stopped
  # the job before integration tests or contracts-check ever ran -- it just
  # now fails a few minutes faster, since contracts-check no longer waits
  # behind test-integration's own ~30 minutes to run.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contracts dependencies
        run: npm ci
        working-directory: contracts

      # Step 17 (§7): installs the real OpenCode binary so the OpenCode
      # adapter's own server-only contract tests (spawning it, GET
      # /api/health, POST /session, GET /event's server.connected
      # handshake -- no AI provider call, no credential needed) run for
      # real in CI, not just on a dev machine. This CI runner has no AI
      # provider configured (no OPENAI_API_KEY/ANTHROPIC_API_KEY secret,
      # and no `opencode auth login` credential store) -- the REAL-
      # scripted-turn tests (internal/adapters/outbound/opencode's own
      # TestRealTurn_* tests) correctly detect that and skip gracefully
      # rather than fail. This is a deliberate, visible trade-off: those
      # tests only prove the SSE-translation logic against a real model
      # response on a machine that HAS a provider configured (verified on
      # a dev machine during this Step's own design phase) -- adding a
      # paid provider secret to CI is a decision left to the user, not
      # made unilaterally here (see this Step's own report/PR description
      # for the same note).
      # opencode-ai ships a `postinstall` script (node ./postinstall.mjs)
      # that does the real work of setting up a working `opencode` binary.
      # npm's newer supply-chain-security default blocks install-time
      # lifecycle scripts for packages it hasn't been told to trust ("npm
      # warn allow-scripts ... not yet covered by allowScripts") -- without
      # --allow-scripts, that postinstall silently never runs, leaving a
      # broken `opencode` on PATH and every opencode-serve-spawning test
      # (this package's own AND internal/sandboxagent/opencodeproc's)
      # failing with a health-check timeout, not a skip. `npm approve-
      # scripts` (what the warning itself suggests) does not work for
      # global installs (no project package.json to record the approval
      # against, npm/cli#9457) -- the actual fix for a one-off `-g`
      # install is the --allow-scripts=<pkg> flag.
      #
      # Needed here too (not just in test-integration below): a handful of
      # opencode/opencodeproc test files spawn a real `opencode serve`
      # process with no `integration` build-tag guard, so they also run
      # under plain `make test`.
      - name: Install OpenCode
        # Deliberate pin (§7 "Pin the OpenCode version"): bump only via a
        # dedicated future PR once a newer version has itself been validated,
        # never an automatic floating install.
        run: npm install -g --allow-scripts=opencode-ai opencode-ai@1.17.15

      - name: Vet
        run: make vet

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

      - name: Lint (custom checks)
        run: go run ./tools/lint/narvichecks ./...

      - name: Test
        run: make test

      - name: Contracts (schema codegen drift + TS typecheck)
        run: make contracts-check

  # test-integration restores job-level parallelism for the ~30 minutes of
  # wall-clock ba24c5d's `-p 1` added, WITHOUT reintroducing the host-Docker
  # contention `-p 1` was fixing (see that commit's own Makefile doc comment
  # for the full incident history: three real CI hangs, three different
  # testcontainers-go internal call sites, one shared root cause). Each
  # group now runs as its own GITHUB ACTIONS JOB, each on its own runner
  # VM with its own, uncontended Docker daemon, so there is no cross-group
  # resource sharing the way there was when everything ran inside one
  # job/VM -- see Makefile's own comment above the test-integration-
  # group-N targets for the WITHIN-group -p value each group actually
  # runs at (verified per group, not uniform across all four).
  #
  # Groups are bin-packed by measured per-package duration (real green CI
  # run 30875940504, 2026-08-04, the merge of ba24c5d itself onto main):
  # internal/adapters/inbound/httpapi alone is ~508s -- roughly as heavy as
  # everything else in the repo COMBINED (~1270s across the other ~70
  # packages), because it spins up its own throwaway Postgres container
  # per test function (~170 of them, no reuse) -- so it gets its own group,
  # and the rest are bin-packed (longest-processing-time greedy) into three
  # more groups of ~420s each. That caps the matrix at 4 legs, each roughly
  # comparable to httpapi's own ~508s floor: adding a 5th+ leg to shave the
  # other three groups down further wouldn't shorten the matrix's overall
  # wall-clock (still bottlenecked by httpapi's own single-package ~508s),
  # it would just multiply GitHub Actions' fixed per-leg overhead (checkout
  # + Go setup + OpenCode install, ~30-45s each) for no benefit -- see this
  # PR's own description for the full timing table this was based on.
  #
  # The exact package groupings live in the Makefile (test-integration-
  # group-1..4), not here, so there's one source of truth for "which
  # packages are in which group" -- see the Makefile's own comment above
  # those targets for how group 4 (the catch-all for everything not
  # explicitly bin-packed into 1-3) is computed, so a newly added package
  # is never silently skipped.
  test-integration:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      # See the "ci" job's own "Install OpenCode" step for the full
      # rationale (Step 17 §7, the --allow-scripts requirement, the pinned
      # version). Duplicated here rather than shared because each matrix
      # leg is a fully independent runner VM -- this group doesn't need
      # contracts/'s npm dependencies (that's contracts-check only, which
      # stays in the "ci" job), just the opencode binary itself for
      # whichever of groups 2/3/4 exercises the opencode/opencodeproc
      # packages.
      - name: Install OpenCode
        run: npm install -g --allow-scripts=opencode-ai opencode-ai@1.17.15

      - name: Test (integration, group ${{ matrix.group }})
        run: make test-integration-group-${{ matrix.group }}

name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/narvidev/narvi/blob/main/CLA.md
          branch: cla-signatures
          allowlist: bleleve,dependabot[bot]
          custom-notsigned-prcomment: 'Thanks for the contribution. Narvi is **source-available** under the [Elastic License 2.0](https://github.com/narvidev/narvi/blob/main/LICENSE), and first-time contributors sign a short [Contributor License Agreement](https://github.com/narvidev/narvi/blob/main/CLA.md) — a license, not an assignment: you keep ownership of your work. Sign by posting the comment below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All committers have signed the CLA. Thank you.'
